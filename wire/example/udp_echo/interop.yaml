experiment: udp-echo-loopback
env_checks:
  - name: python3
    command: python3 -c "import sys"
peers:
  - name: echo-server
    path: .
    family: example-server
    under_test: true
    build: python3 build.py
    binaries: [bin/udp_echo_server.py]
    start: python3 bin/udp_echo_server.py --port 47321
    ready: {command: "python3 ready.py {bundle}/echo-server.log", timeout_s: 10}
  - name: echo-server-broken
    path: .
    family: example-server
    under_test: true
    build: python3 build.py
    binaries: [bin/udp_echo_server.py]
    start: python3 bin/udp_echo_server.py --port 47321 --corrupt
    ready: {command: "python3 ready.py {bundle}/echo-server-broken.log", timeout_s: 10}
  - name: echo-client
    path: .
    family: example-client
    under_test: true
    build: python3 build.py
    binaries: [bin/udp_echo_client.py]
    start: python3 bin/udp_echo_client.py --port 47321 --payload-file vectors/payload.bin
capture: {interface: loopback, filter: udp port 47321}
cells:
  - name: echo
    server: echo-server
    clients: [echo-client]
    checkers: [observes-echo, vector]
    timeout_s: 20
  - name: echo-broken
    server: echo-server-broken
    clients: [echo-client]
    checkers: [observes-echo, vector]
    timeout_s: 20
checkers:
  - name: observes-echo
    family: example-checker
    observes_capture: true
    command: python3 check_capture.py --port 47321 {capture}
    inputs: []
    negatives:
      - {input: negatives/unrelated.pcap, replaces: "{capture}"}
      - {input: negatives/no_echo.pcap, replaces: "{capture}"}
  - name: vector
    family: example-checker
    observes_capture: false
    command: python3 check_vector.py --port 47321 {capture} {inputs}/vectors/payload.bin
    inputs: [vectors/payload.bin]
    negatives:
      - {input: vectors/payload_flipped.bin, replaces: vectors/payload.bin}

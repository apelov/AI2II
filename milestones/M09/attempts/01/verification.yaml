claim_audit:
  - claim: "AC1: In the TLS example, wire run exits 0 with verdict PASS, writing capture.pcap without cleartext payload, secrets/ with non-empty key logs, capture-decrypted.pcapng displaying payload under tshark, decrypt.log, SHA256SUMS, and contains_secrets: true"
    holds: true
  - claim: "AC2: A peer declaring a secret file but not writing it (or writing it empty) yields BLOCKED (exit 3) naming the file; decrypt and checkers do not run"
    holds: true
  - claim: "AC3: Decrypt command exiting non-zero or leaving {decrypted} missing/empty yields FAIL (exit 1) with 'decrypt failed'; capture.pcap is kept and listed in SHA256SUMS"
    holds: true
  - claim: "AC4: observes_decrypted checker negatives re-run decrypt into scratch; mutant checkers only checking file existence or key file fail with reason 'checker accepts negative'"
    holds: true
  - claim: "AC5: observes_capture checker rejects asserts: encrypted negative; raw checker accepting cleartext TCP makes cell FAIL"
    holds: true
  - claim: "AC6: Manifest validation exits 2 before env check, build, start or capture for all 19 invalid/malformed configuration cases"
    holds: true
  - claim: "AC7: Peer env variables present in peer process with {secrets} expanded, absent from other peers; {secrets} exists before peer build/start"
    holds: true
  - claim: "AC8: Symlinked secret yields BLOCKED; env.json records decrypt executable absolute path and sha256; verify-bundle checks integrity"
    holds: true
  - claim: "AC9: M08 acceptance suite passes unchanged; un-secured bundles contain no secrets, decrypted pcapng, or decrypt.log, and contains_secrets is false"
    holds: true
  - claim: "AC10: wire/ contains no protocol knowledge for this feature (zero references to editcap, tshark, SSLKEYLOGFILE, tls, dtls, quic, oscore)"
    holds: true

notes:
  validity_rationale:
    AC1: "Kept 'fails_on: base' because AC1 tests the complete end-to-end integration of all M09 secured runner features and example assets (TLS example, secrets, decrypt step, decrypted capture generation). At base commit c74bd65407b8, none of these features existed."
    AC7: "Kept 'fails_on: base' because AC7 tests peer process environment expansion of {secrets} and pre-build directory creation, which are wholly absent at base commit c74bd65407b8."
    AC4_mutants: "Both holes identified in the review were falsified: mutant ac4_skip_scratch_decrypt (skipping scratch decrypt re-run of {secrets}/<file> negatives) was logged at runs/M09/01/49adba644d07/validity-AC4.log; mutant ac4_skip_decrypted_negative (skipping {decrypted} replacement negatives) was additionally logged at runs/M09/01/49adba644d07/validity-AC4-decrypted.log."

